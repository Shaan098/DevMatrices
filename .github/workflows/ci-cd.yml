name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build frontend & backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server deps
        working-directory: ./server
        run: |
          npm ci

      - name: Install client deps & build
        working-directory: ./client
        run: |
          npm ci
          npm run build

  publish:
    name: Build & push Docker images (main)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pepproject-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pepproject-server:${{ github.sha }}

      - name: Build and push client image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pepproject-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pepproject-client:${{ github.sha }}

  deploy_azure:
    name: Deploy to Azure Web App (optional)
    needs: publish
    runs-on: ubuntu-latest
    if: secrets.AZURE_WEBAPP_PUBLISH_PROFILE != ''
    steps:
      - name: Deploy server to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/pepproject-server:latest

  deploy_digitalocean:
    name: Deploy to DigitalOcean App Platform (optional)
    needs: publish
    runs-on: ubuntu-latest
    if: secrets.DO_API_TOKEN != ''
    steps:
      - name: Authenticate doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update DigitalOcean App
        run: |
          if [ -n "${{ secrets.DO_APP_ID }}" ]; then
            echo "Attempting to update DO App ${{ secrets.DO_APP_ID }} using .do/app.yaml (if present)"
            doctl apps update "${{ secrets.DO_APP_ID }}" --spec .do/app.yaml || echo "No .do/app.yaml or update failed — please create an App spec or update via the DO dashboard"
          else
            echo "Set DO_APP_ID secret and provide .do/app.yaml to update App Platform via doctl"
          fi

